<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1024 Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>1024</h1>
      <p class="subtitle">Combine tiles to reach 1024.</p>
    </header>

    <section class="top-bar">
      <div class="score-group">
        <article class="score-card" aria-label="Current score">
          <span>Score</span>
          <strong id="score">0</strong>
        </article>
        <article class="score-card" aria-label="Best score">
          <span>Best</span>
          <strong id="best-score">0</strong>
        </article>
      </div>
      <button id="new-game-btn" class="new-game-btn" type="button">New Game</button>
    </section>

    <section class="instructions">
      Use arrow keys (or swipe) to move tiles.
    </section>

    <section id="board" class="board" aria-label="1024 game board"></section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
